name: Fixture regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Evidence release gate
        working-directory: evidence-release-gate
        run: python -m unittest discover -s tests -v
      - name: Interview coordination
        working-directory: interview-orchestration
        run: python -B -m unittest -v
